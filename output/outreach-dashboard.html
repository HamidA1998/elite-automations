<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hamid Enterprise Ops CRM</title>
  <style>
    :root{
      --bg:#f4f5f7;
      --bg-2:#eef2f7;
      --surface:rgba(255,255,255,.78);
      --surface-strong:#ffffff;
      --line:rgba(15,23,42,.08);
      --line-strong:rgba(15,23,42,.14);
      --ink:#0f172a;
      --muted:#667085;
      --accent:#2563eb;
      --accent-2:#0ea5e9;
      --amber:#f59e0b;
      --green:#16a34a;
      --rose:#ef4444;
      --violet:#7c3aed;
      --radius-xl:28px;
      --radius-lg:22px;
      --radius-md:18px;
      --radius-sm:14px;
      --shadow-xl:0 28px 80px rgba(15,23,42,.12);
      --shadow-lg:0 18px 42px rgba(15,23,42,.08);
      --shadow-sm:0 10px 24px rgba(15,23,42,.06);
      --detail-width:560px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(14,165,233,.14), transparent 25%),
        radial-gradient(circle at 92% 8%, rgba(124,58,237,.10), transparent 18%),
        linear-gradient(180deg, #f9fbfd 0%, #eef3f8 48%, #f8fafc 100%);
      font-family:"SF Pro Display","SF Pro Text","Inter",ui-sans-serif,system-ui,sans-serif;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    input,select,textarea{
      border:1px solid var(--line);
      background:rgba(255,255,255,.9);
      color:var(--ink);
      border-radius:16px;
      padding:13px 14px;
      outline:none;
    }
    textarea{resize:vertical;min-height:120px}
    button{
      border:none;
      cursor:pointer;
      border-radius:14px;
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    }
    button:hover{transform:translateY(-1px)}
	    .app{
	      display:grid;
	      grid-template-columns:104px 300px minmax(0,1fr);
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
      isolation:isolate;
    }
    .app::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.56), transparent 22%),
        radial-gradient(circle at 12% 12%, rgba(37,99,235,.10), transparent 22%),
        radial-gradient(circle at 88% 8%, rgba(124,58,237,.08), transparent 20%);
      z-index:-1;
    }
    .rail,.sidebar{
      position:sticky;
      top:0;
      height:100vh;
      backdrop-filter:blur(18px);
    }
	    .rail{
	      border-right:1px solid var(--line);
	      background:linear-gradient(180deg, rgba(248,250,252,.92), rgba(244,247,251,.82));
	      display:flex;
	      flex-direction:column;
	      gap:16px;
	      padding:18px 12px 16px;
	    }
	    .mark{
	      width:100%;
	      min-height:92px;
	      border-radius:24px;
      display:grid;
      align-content:center;
      justify-items:center;
      gap:6px;
      background:linear-gradient(135deg,#111827,#334155 62%,#60a5fa);
      color:#fff;
	      font-size:.82rem;
      font-weight:800;
      letter-spacing:.08em;
      box-shadow:var(--shadow-sm);
	      padding:14px 10px;
      text-align:center;
    }
    .mark strong{
	      font-size:1rem;
      letter-spacing:.12em;
    }
    .mark small{
      color:rgba(255,255,255,.72);
      line-height:1.2;
      display:block;
      font-size:.68rem;
      letter-spacing:.08em;
    }
    .rail-nav{
      display:grid;
      gap:8px;
    }
	    .rail-btn{
	      width:100%;
	      min-height:68px;
	      display:grid;
	      justify-items:center;
	      align-content:center;
	      gap:6px;
      text-align:center;
	      padding:10px 8px;
      border-radius:20px;
      background:rgba(255,255,255,.72);
      box-shadow:var(--shadow-sm);
      color:#475569;
      font-weight:700;
      border:1px solid rgba(15,23,42,.04);
    }
	    .rail-btn strong{
	      display:block;
	      font-size:.74rem;
	      letter-spacing:.08em;
	      color:#0f172a;
	      line-height:1.1;
	      text-transform:uppercase;
	    }
	    .rail-btn small{
	      display:none;
	    }
    .rail-btn.active,.rail-btn:hover{
      background:#0f172a;
      color:#fff;
    }
    .rail-btn.active strong,.rail-btn:hover strong{
      color:#fff;
    }
	    .rail-glyph{
	      width:38px;
	      height:38px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:rgba(15,23,42,.06);
      color:inherit;
      font-size:.7rem;
      font-weight:800;
      letter-spacing:.06em;
    }
    .rail-btn.active .rail-glyph,.rail-btn:hover .rail-glyph{
      background:rgba(255,255,255,.14);
    }
    .rail-footer{
      margin-top:auto;
      padding:10px;
      border-radius:18px;
      background:rgba(255,255,255,.66);
      border:1px solid rgba(15,23,42,.05);
      display:grid;
      gap:6px;
      text-align:center;
    }
    .rail-footer strong{
      font-size:.78rem;
      line-height:1.35;
    }
    .sidebar{
      border-right:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,.38));
      padding:18px 16px;
      display:grid;
      grid-template-rows:auto auto minmax(0,1fr);
      gap:14px;
    }
    .main{
      padding:22px 24px 36px;
      display:grid;
      gap:22px;
      min-width:0;
      align-content:start;
    }
    .glass,.panel,.hero,.table-shell,.chart-shell,.workspace-card,.detail-card{
      background:var(--surface);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow-lg);
      backdrop-filter:blur(18px);
      border-radius:var(--radius-xl);
    }
    .hero{
      padding:28px 30px;
      display:grid;
      grid-template-columns:1.2fr .9fr;
      gap:24px;
      align-items:start;
    }
    .hero h1{
      margin:8px 0 0;
      font-size:2.2rem;
      line-height:.95;
      letter-spacing:-.05em;
    }
    .hero.crm{background:linear-gradient(135deg, rgba(37,99,235,.12), rgba(255,255,255,.82) 48%, rgba(14,165,233,.12))}
    .hero.ai{background:linear-gradient(135deg, rgba(124,58,237,.12), rgba(255,255,255,.82) 48%, rgba(59,130,246,.08))}
    .hero.ops{background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(255,255,255,.84) 48%, rgba(16,185,129,.10))}
    .hero.vid{background:linear-gradient(135deg, rgba(236,72,153,.10), rgba(255,255,255,.84) 48%, rgba(124,58,237,.12))}
    .hero.mail{background:linear-gradient(135deg, rgba(16,185,129,.12), rgba(255,255,255,.84) 48%, rgba(37,99,235,.08))}
    .hero.pay{background:linear-gradient(135deg, rgba(22,163,74,.14), rgba(255,255,255,.84) 48%, rgba(245,158,11,.12))}
    .hero.ea{background:linear-gradient(135deg, rgba(15,23,42,.08), rgba(255,255,255,.86) 48%, rgba(14,165,233,.10))}
    .hero p,.muted,.empty p,.stat p,.list-meta,.mini p,.detail-sub{
      color:var(--muted);
      line-height:1.5;
      overflow-wrap:anywhere;
    }
    h1,h2,h3,strong,p,small,span,td,th,button,a{min-width:0}
    h1,h2,h3{ text-wrap:balance; }
    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:.72rem;
      font-weight:700;
      color:#64748b;
    }
    .hero-actions,.toolbar-actions,.row-actions,.tab-strip,.chip-row,.sync-row,.mini-grid,.tri-grid,.duo-grid,.form-grid,.top-metrics,.pipeline-strip,.detail-actions,.detail-tabs,.entity-row,.asset-links,.tag-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .between > :first-child,
    .feed-top > :first-child,
    .task-head > :first-child,
    .proposal-head > :first-child,
    .detail-head > :first-child,
    .small-grid > :first-child{
      min-width:0;
      flex:1 1 auto;
    }
    .btn-primary{
      padding:12px 16px;
      background:#0f172a;
      color:#fff;
      box-shadow:var(--shadow-sm);
    }
    .btn-secondary{
      padding:12px 16px;
      background:rgba(15,23,42,.05);
      color:#334155;
    }
    .btn-ghost{
      padding:10px 12px;
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      color:#334155;
    }
    .toolbar{
      display:grid;
      grid-template-columns:minmax(260px,1.25fr) repeat(3,minmax(180px,.9fr)) minmax(180px,.8fr);
      gap:16px;
      padding:18px 20px;
      align-items:end;
    }
    .toolbar input,.toolbar select{width:100%}
    .toolbar > *{min-width:0}
    .top-metrics{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
    }
    .stat{
      padding:18px;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.68));
      min-height:150px;
      display:grid;
      gap:10px;
      overflow:hidden;
    }
    .stat strong{
      font-size:2rem;
      letter-spacing:-.05em;
    }
    .spark{
      height:48px;
      display:flex;
      gap:6px;
      align-items:flex-end;
    }
    .spark i{
      flex:1;
      min-height:12px;
      border-radius:999px;
      background:linear-gradient(180deg,var(--accent-2),var(--accent));
      animation:rise .7s cubic-bezier(.2,.9,.2,1) both;
    }
    @keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
    .workspace{
      display:none;
      gap:18px;
    }
    .workspace.active{display:grid}
    .executive-shell,.crm-shell,.intel-shell,.ops-shell,.studio-shell,.mail-shell,.pay-shell{
      display:grid;
      gap:18px;
    }
    .executive-shell{grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr)}
    .crm-shell{grid-template-columns:minmax(0,1.4fr) minmax(320px,.6fr)}
    .intel-shell{grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr)}
    .ops-shell{grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr)}
    .studio-shell{grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr)}
    .mail-shell{grid-template-columns:minmax(300px,.82fr) minmax(300px,.82fr) minmax(0,1.1fr)}
    .pay-shell{grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr)}
    .workspace-stack{display:grid;gap:18px;min-width:0}
    .workspace-band{
      display:grid;
      gap:14px;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    }
    .workspace-split{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(280px,.72fr);
      gap:18px;
    }
    .workspace-panel{
      padding:24px;
      border-radius:28px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow-lg);
      min-width:0;
    }
    .workspace-panel h3{
      margin:8px 0 0;
      font-size:1.28rem;
      letter-spacing:-.03em;
    }
    .workspace-kpi{
      padding:16px;
      border-radius:20px;
      background:rgba(15,23,42,.035);
      border:1px solid rgba(15,23,42,.05);
      display:grid;
      gap:8px;
    }
    .workspace-kpi strong{
      font-size:1.5rem;
      letter-spacing:-.04em;
    }
    .spotlight-list{display:grid;gap:12px}
    .spotlight-item{
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(15,23,42,.05);
      display:grid;
      gap:8px;
    }
    .mode-table{
      display:grid;
      gap:10px;
    }
    .mode-row{
      display:grid;
      grid-template-columns:minmax(0,1.15fr) repeat(4,minmax(90px,.4fr));
      gap:12px;
      align-items:center;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.84);
      border:1px solid rgba(15,23,42,.05);
    }
    .mode-row > *{min-width:0}
    .mail-shell .workspace-panel,.studio-shell .workspace-panel,.pay-shell .workspace-panel,.intel-shell .workspace-panel,.crm-shell .workspace-panel,.executive-shell .workspace-panel,.ops-shell .workspace-panel{min-width:0}
    .duo-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:18px}
    .tri-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .workspace-card,.chart-shell,.table-shell{
      padding:20px;
      min-width:0;
    }
    .sidebar-card{
      padding:20px;
      border-radius:24px;
      background:rgba(255,255,255,.76);
      box-shadow:var(--shadow-sm);
      border:1px solid rgba(255,255,255,.7);
      min-width:0;
    }
    .sidebar-scroll{
      overflow:auto;
      min-height:0;
      display:grid;
      gap:10px;
      padding-right:4px;
    }
    .sidebar-client{
      padding:15px;
      border-radius:20px;
      background:rgba(255,255,255,.86);
      box-shadow:var(--shadow-sm);
      border:1px solid rgba(15,23,42,.04);
      display:grid;
      gap:10px;
      text-align:left;
      width:100%;
    }
    .sidebar-client.active{
      outline:1px solid rgba(37,99,235,.28);
      box-shadow:0 16px 38px rgba(37,99,235,.10);
    }
    .score-ring{
      width:54px;height:54px;
      border-radius:50%;
      display:grid;place-items:center;
      background:conic-gradient(var(--rose),var(--amber),var(--accent-2),var(--accent));
      padding:4px;
    }
    .score-ring span{
      width:100%;height:100%;
      border-radius:50%;
      display:grid;place-items:center;
      background:#fff;
      font-size:.85rem;
      font-weight:700;
    }
    .small-grid{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:start;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      padding:7px 10px;
      border-radius:999px;
      font-size:.78rem;
      font-weight:700;
      border:1px solid rgba(15,23,42,.06);
      background:rgba(255,255,255,.82);
      color:#475569;
    }
    .tone-positive{background:rgba(22,163,74,.12);color:#15803d}
    .tone-warning{background:rgba(245,158,11,.14);color:#b45309}
    .tone-critical{background:rgba(239,68,68,.12);color:#dc2626}
    .tone-info{background:rgba(37,99,235,.12);color:#1d4ed8}
    .chart-grid{
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
      gap:18px;
    }
    .bars{
      margin-top:18px;
      min-height:220px;
      display:grid;
      grid-template-columns:repeat(8,minmax(0,1fr));
      gap:10px;
      align-items:end;
    }
    .bar{
      display:grid;
      gap:10px;
      text-align:center;
    }
    .track{
      height:210px;
      padding:8px;
      border-radius:20px;
      background:rgba(15,23,42,.05);
      display:flex;
      align-items:flex-end;
    }
    .fill{
      width:100%;
      border-radius:14px;
      background:linear-gradient(180deg,#7dd3fc,#2563eb 64%,#1d4ed8);
      transform-origin:bottom;
      animation:grow .8s cubic-bezier(.2,.9,.2,1) both;
    }
    @keyframes grow{from{transform:scaleY(.1);opacity:.2}to{transform:scaleY(1);opacity:1}}
    .donut{
      width:200px;height:200px;
      border-radius:50%;
      margin:18px auto;
      background:conic-gradient(var(--rose) 0 calc(var(--critical)*1deg), var(--amber) calc(var(--critical)*1deg) calc((var(--critical) + var(--weak))*1deg), var(--green) calc((var(--critical)+var(--weak))*1deg) 360deg);
      display:grid;place-items:center;
    }
    .donut::after{
      content:"";
      width:128px;height:128px;border-radius:50%;
      background:#fff;
      box-shadow:inset 0 0 0 1px rgba(15,23,42,.06);
    }
    .table-shell{overflow:auto}
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0 10px;
      min-width:900px;
    }
    th{
      font-size:.78rem;
      text-transform:uppercase;
      letter-spacing:.14em;
      color:#64748b;
      text-align:left;
      padding:0 12px 8px;
    }
    td{
      background:rgba(255,255,255,.82);
      padding:14px 12px;
      border-top:1px solid rgba(15,23,42,.04);
      border-bottom:1px solid rgba(15,23,42,.04);
      vertical-align:top;
    }
    td:first-child{border-left:1px solid rgba(15,23,42,.04);border-top-left-radius:16px;border-bottom-left-radius:16px}
    td:last-child{border-right:1px solid rgba(15,23,42,.04);border-top-right-radius:16px;border-bottom-right-radius:16px}
    tr[data-client]{cursor:pointer}
    .list,.feed,.memory-list,.suggest-list,.task-stack,.asset-grid,.proposal-grid{
      display:grid;
      gap:12px;
    }
    .feed,.memory-list,.task-stack{max-height:430px;overflow:auto;padding-right:4px}
    .feed,.memory-list,.task-stack,.sidebar-scroll,.detail-body{overscroll-behavior:contain}
    .feed-card,.task-card,.memory-card,.suggest-card,.asset-card,.proposal-card,.contact-card,.note-card{
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(15,23,42,.05);
      box-shadow:var(--shadow-sm);
    }
    .feed-top,.between,.task-head,.proposal-head,.detail-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .feed small,.tiny{color:#64748b}
    .kanban{
      display:grid;
      grid-template-columns:repeat(8,minmax(180px,1fr));
      gap:12px;
      overflow:auto;
      padding-bottom:6px;
    }
    .lane{
      min-height:280px;
      background:rgba(15,23,42,.035);
      border-radius:22px;
      padding:14px;
      display:grid;
      align-content:start;
      gap:10px;
    }
    .mini{
      padding:12px;
      border-radius:16px;
      background:rgba(255,255,255,.82);
      box-shadow:var(--shadow-sm);
      border:1px solid rgba(15,23,42,.05);
      display:grid;
      gap:8px;
      text-align:left;
      min-width:0;
    }
    .empty{
      padding:24px;
      border-radius:20px;
      background:rgba(15,23,42,.04);
      color:var(--muted);
    }
    .asset-grid{
      grid-template-columns:repeat(3,minmax(0,1fr));
    }
    .asset-card img{
      width:100%;
      height:190px;
      object-fit:cover;
      border-radius:16px;
      display:block;
      margin-bottom:12px;
      background:#e5e7eb;
    }
    .metric-pill{
      padding:10px 12px;
      border-radius:16px;
      background:rgba(15,23,42,.04);
      display:grid;
      gap:6px;
      min-width:0;
    }
    .metric-pill strong{font-size:1.2rem}
    .workspace-title{
      display:grid;
      gap:10px;
    }
    .workspace-title h1{
      margin:0;
      font-size:2rem;
      line-height:.94;
      letter-spacing:-.05em;
    }
    .workspace-title p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      max-width:70ch;
    }
    .detail-modal{
      position:fixed;
      inset:18px 18px 18px auto;
      width:min(var(--detail-width),calc(100vw - 36px));
      max-width:calc(100vw - 36px);
      border-radius:32px;
      background:rgba(255,255,255,.76);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow-xl);
      backdrop-filter:blur(22px);
      transform:translateX(calc(100% + 30px));
      transition:transform .26s ease;
      z-index:40;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      pointer-events:none;
    }
    .detail-modal.open{transform:none;pointer-events:auto}
    .detail-modal.empty-state{
      width:min(420px,calc(100vw - 36px));
    }
    .detail-handle{
      position:absolute;
      left:-12px;
      top:78px;
      bottom:78px;
      width:24px;
      cursor:ew-resize;
    }
    .detail-header{
      padding:18px 18px 10px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.58);
      display:grid;
      gap:12px;
    }
    .detail-tabs{
      padding:0 18px 12px;
      border-bottom:1px solid rgba(15,23,42,.05);
    }
    .detail-tab{
      padding:9px 12px;
      background:rgba(15,23,42,.05);
      color:#475569;
      border-radius:12px;
    }
    .detail-tab.active{background:#0f172a;color:#fff}
    .detail-body{
      padding:18px;
      overflow:auto;
      display:grid;
      gap:16px;
      min-width:0;
    }
    .detail-body h2{
      margin:8px 0 0;
      font-size:2rem;
      line-height:.96;
      letter-spacing:-.05em;
    }
    .detail-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }
    .detail-card{
      padding:16px;
      display:grid;

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtDate(value) {
      if (!value) return 'N/A';
      return new Date(value).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
    }

    function fmtMoney(value) {
      return new Intl.NumberFormat('en-GB', {style:'currency', currency:'GBP', maximumFractionDigits:0}).format(value || 0);
    }

    function outputPath(filePath) {
      if (!filePath) return '#';
      const normalized = String(filePath).replace(/\\/g, '/');
      const index = normalized.lastIndexOf('/output/');
      if (index >= 0) return normalized.slice(index + '/output'.length);
      return normalized.startsWith('/') ? normalized : '/' + normalized;
    }

      return '<span class="badge ' + (toneMap[tone] || '') + '">' + esc(label) + '</span>';

      if (score <= 30) return ['Critical', 'tone-critical'];

    function allTasks() {
      return store.data.clients.flatMap((client) => client.tasks.map((task) => ({client, task})));
    }

    function progressForClient(client) {
      const completed = client.tasks.filter((task) => task.status === 'done').length;
      const totalTasks = Math.max(client.tasks.length, 1);
      const statusWeight = {
        researched: 10,
        'ready-to-send': 24,
        contacted: 40,
        'in-follow-up': 55,
        replied: 70,
        proposal: 82,
        won: 100,
        lost: 100,
      }[client.accountStatus] || 0;
      return Math.min(100, Math.round((completed / totalTasks) * 38 + statusWeight * 0.62));
    }

    function paymentSummary(clients) {
      const proposals = clients.flatMap((client) => client.proposals.map((proposal) => ({client, proposal})));
      const collected = proposals.filter((item) => item.proposal.status === 'accepted').reduce((sum, item) => sum + item.proposal.price, 0);
      const pipeline = proposals.filter((item) => item.proposal.status !== 'accepted' && item.proposal.status !== 'lost').reduce((sum, item) => sum + item.proposal.price, 0);
      const wonDeals = proposals.filter((item) => item.proposal.status === 'accepted').length;
      const avgDeal = wonDeals ? Math.round(collected / wonDeals) : 0;
      return {
        proposals,
        collected,
        pipeline,
        wonDeals,
        avgDeal,
        outstanding: Math.max(0, pipeline - collected),
      };
    }

    function mailSummary(clients) {
      const emails = clients.flatMap((client) => client.outreachActivities.filter((activity) => activity.type === 'email').map((activity) => ({client, activity})));
      return {
        emails,
        inbox: emails.filter((item) => item.activity.status === 'replied'),
        sent: emails.filter((item) => item.activity.status === 'sent' || item.activity.status === 'delivered'),
        drafts: clients.filter((client) => client.emailFile),
        queue: clients.filter((client) => ['ready-to-send', 'contacted', 'in-follow-up'].includes(client.accountStatus)),
      };
    }

    function renderPalette() {
      if (!store.paletteOpen) {
        paletteRoot.className = 'palette';
        paletteRoot.innerHTML = '';
        return;
      }
      const query = store.paletteQuery.trim().toLowerCase();
      const actions = [
        {id:'/new', label:'/new', description:'Open New Account modal', handler:() => { store.accountModalOpen = true; store.paletteOpen = false; render(); }},
        {id:'/sync', label:'/sync', description:'Sync latest pipeline output', handler:() => runMutation(() => api.importPipeline())},
        {id:'/today', label:'/today', description:'Jump to Ops daily batch planner', handler:() => { store.view = 'ops'; store.paletteOpen = false; render(); }},
        {id:'/metrics', label:'/metrics', description:'Jump to EA executive overview', handler:() => { store.view = 'ea'; store.paletteOpen = false; render(); }},
        ...['crm','ops','ai','vid','mail','pay'].filter((view) => !query || ('go ' + view).includes(query)).map((view) => ({
          id:'go-' + view,
          label:'go ' + view,
          description:'Switch to ' + view.toUpperCase() + ' mode',
          handler:() => { store.view = view; store.paletteOpen = false; render(); },
        })),
        ...store.data.clients
          .filter((client) => !query || [client.clientId, client.businessName, client.businessType, client.area].join(' ').toLowerCase().includes(query))
          .slice(0, 12)
	          .map((client) => ({
	            id: client.clientId,
	            label: client.businessName,
	            description: client.clientId + ' • ' + client.businessType + ' • ' + client.area,
	            handler:async () => {
	              store.selectedClientId = client.clientId;
	              store.accountFull = await api.getAccountFull(client.clientId);
	              store.detailOpen = true;
	              store.paletteOpen = false;
	              render();
	            },
	          })),
      ];
      paletteRoot.className = 'palette open';
      paletteRoot.innerHTML = `
        <div class="palette-card">
          <input id="paletteInput" value="${esc(store.paletteQuery)}" placeholder="Search accounts or jump to commands" />
          <div class="palette-list">
            ${actions.map((item) => `
              <button class="palette-item" data-action="palette-select" data-palette-id="${esc(item.id)}">
                <strong>${esc(item.label)}</strong>
                <div class="list-meta">${esc(item.description)}</div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
      store.paletteActions = Object.fromEntries(actions.map((item) => [item.id, item.handler]));
    }

	    function applyResponsiveLayout() {
      const isMobile = window.innerWidth <= 860;
      const maxWidth = Math.max(320, window.innerWidth - (isMobile ? 20 : 36));
      const minWidth = isMobile ? 320 : 420;
      store.detailWidth = Math.max(minWidth, Math.min(maxWidth, store.detailWidth));
      document.body.style.setProperty('--detail-width', store.detailWidth + 'px');
      document.body.dataset.viewport = isMobile ? 'mobile' : window.innerWidth <= 1180 ? 'compact' : 'desktop';
      if (isMobile && store.detailOpen) {
        store.detailOpen = false;
      }
    }

	    function render() {
      applyResponsiveLayout();
      const clients = filteredClients();
      const client = activeClient();
      const railItems = [
        ['ea', 'EA'],
        ['crm', 'CRM'],
        ['ai', 'AI'],
        ['ops', 'OPS'],
        ['vid', 'VID'],
        ['mail', 'MAIL'],
        ['pay', 'PAY'],
      ];
      const workspaceByView = {
        ea: renderExecutive(clients),
        crm: renderCrm(clients),
        ai: renderAi(clients),
        ops: renderOps(clients),
        vid: renderVideo(clients),
        mail: renderMail(clients),
        pay: renderPayments(clients),
      };
      document.body.style.setProperty('--detail-width', store.detailWidth + 'px');
      app.innerHTML = `
        <div class="app">
          <nav class="rail">
            <div class="mark">
              <strong>EA / OS</strong>
              <small>CONTROL SURFACE</small>
            </div>
            <div class="rail-nav">

            </div>

              <div class="eyebrow">System</div>

          <main class="main">
            ${renderToolbar()}
            ${renderWorkspaceHero(store.view, clients)}
            ${workspaceByView[store.view] || renderExecutive(clients)}
          </main>
        </div>
	      ${renderDetail(client)}

	      renderPalette();
	      renderAccountModal();
	      bindInputs();
	      bindResize();

	    function bindInputs() {
      const search = document.getElementById('searchInput');
      if (search) {
        search.addEventListener('input', (event) => {
          store.query = event.target.value;
          render();
        });
      }
      const statusFilter = document.getElementById('statusFilter');
      if (statusFilter) {
        statusFilter.addEventListener('change', (event) => {
          store.status = event.target.value;
          render();
        });
      }
      const priorityFilter = document.getElementById('priorityFilter');
      if (priorityFilter) {
        priorityFilter.addEventListener('change', (event) => {
          store.priority = event.target.value;
          render();
        });
      }
	      const paletteInput = document.getElementById('paletteInput');
	      if (paletteInput) {
	        paletteInput.focus();
	        paletteInput.addEventListener('input', (event) => {
	          store.paletteQuery = event.target.value;
	          renderPalette();
	        });
	      }
	      document.querySelectorAll('[data-inline-account]').forEach((input) => {
	        input.addEventListener('blur', async (event) => {
	          if (!store.selectedClientId) return;
	          const field = event.target.dataset.inlineAccount;
	          const value = event.target.value;
	          await runMutation(() => api.patchAccount(store.selectedClientId, {[field]: value}));
	          event.target.classList.add('save-flash');
	          setTimeout(() => event.target.classList.remove('save-flash'), 320);
	        });
	      });
	      document.querySelectorAll('[data-memory-field]').forEach((input) => {
	        input.addEventListener('blur', async (event) => {
	          if (!store.selectedClientId) return;
	          const field = event.target.dataset.memoryField;
	          const value = event.target.value;
	          await runMutation(() => api.patchMemory(store.selectedClientId, {[field]: value}));
	          event.target.classList.add('save-flash');
	          setTimeout(() => event.target.classList.remove('save-flash'), 320);
	        });
	      });
	      document.querySelectorAll('[data-audit-criterion]').forEach((input) => {
	        input.addEventListener('blur', async (event) => {
	          if (!store.selectedClientId) return;
	          const criterion = event.target.dataset.auditCriterion;
	          const noteEl = document.querySelector('[data-audit-note="' + criterion + '"]');
	          await runMutation(() => api.saveAuditScore(store.selectedClientId, {
	            criterion,
	            score: Number(event.target.value || 0),
	            note: noteEl ? noteEl.value : '',
	          }));
	        });
	      });
	      document.querySelectorAll('[data-audit-note]').forEach((input) => {
	        input.addEventListener('blur', async (event) => {
	          if (!store.selectedClientId) return;
	          const criterion = event.target.dataset.auditNote;
	          const scoreEl = document.querySelector('[data-audit-criterion="' + criterion + '"]');
	          await runMutation(() => api.saveAuditScore(store.selectedClientId, {
	            criterion,
	            score: Number(scoreEl ? scoreEl.value : 0),
	            note: event.target.value || '',
	          }));
	        });
	      });
	      document.querySelectorAll('[data-analysis-field]').forEach((input) => {
	        input.addEventListener('blur', async (event) => {
	          if (!store.selectedClientId) return;
	          const field = event.target.dataset.analysisField;
	          const lines = String(event.target.value || '').split('\n').map((item) => item.trim()).filter(Boolean);
	          const payload = field === 'recommendedActions' ? {recommendedActions: event.target.value || ''} : {[field]: lines};
	          await runMutation(() => api.saveAuditAnalysis(store.selectedClientId, payload));
	        });
	      });
	    }

    function bindResize() {
      const handle = document.getElementById('detailHandle');
      if (!store.resizeListenerBound) {
        store.resizeListenerBound = true;
        window.addEventListener('resize', () => {
          const beforeOpen = store.detailOpen;
          const beforeWidth = store.detailWidth;
          applyResponsiveLayout();
          if (beforeOpen !== store.detailOpen || beforeWidth !== store.detailWidth) {
            render();
          }
        });
      }
      if (!handle) return;
      let resizing = false;
      handle.onmousedown = (event) => {
        resizing = true;
        event.preventDefault();
      };
      window.onmousemove = (event) => {
        if (!resizing) return;
        store.detailWidth = Math.max(420, Math.min(window.innerWidth - 24, window.innerWidth - event.clientX + 6));
        localStorage.setItem('elite-detail-width', String(store.detailWidth));
        document.body.style.setProperty('--detail-width', store.detailWidth + 'px');
      };
      window.onmouseup = () => { resizing = false; };
    }

	    async function refreshState() {
	      store.data = await api.state();
	      if (!store.data.clients.find((client) => client.clientId === store.selectedClientId)) {
	        store.selectedClientId = store.data.clients[0]?.clientId || null;
	      }
	      if (store.selectedClientId) {
	        try {
	          store.accountFull = await api.getAccountFull(store.selectedClientId);
	        } catch {
	          store.accountFull = null;
	        }
	      }
	      await hydratePanels();
	      render();
	    }

	    async function runMutation(fn) {
	      try {
	        store.data = await fn();
	        if (!store.selectedClientId && store.data.clients[0]) store.selectedClientId = store.data.clients[0].clientId;
	        if (store.selectedClientId) {
	          try {
	            store.accountFull = await api.getAccountFull(store.selectedClientId);
	          } catch {
	            store.accountFull = null;
	          }
	        }
	        await hydratePanels();
	        render();
	      } catch (error) {
	        alert(error instanceof Error ? error.message : 'Request failed');
	      }
	    }

	    async function createAccount() {
	      store.accountModalOpen = true;
	      render();
	    }

    document.addEventListener('click', async (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const clientId = target.dataset.clientId;
	      if (action === 'select-view') {
	        store.view = target.dataset.view;
	        localStorage.setItem('elite-view', store.view);
	        render();
	      } else if (action === 'select-client' && clientId) {
	        store.selectedClientId = clientId;
	        store.detailOpen = true;
	        try {
	          store.accountFull = await api.getAccountFull(clientId);
	        } catch (error) {
	          store.accountFull = null;
	          alert(error instanceof Error ? error.message : 'Unable to open this account right now.');
	        }
	        render();
	      } else if (action === 'toggle-detail') {
	        store.detailOpen = !store.detailOpen;
	        render();
      } else if (action === 'detail-tab') {
        store.detailTab = target.dataset.tab;
        render();
	      } else if (action === 'open-palette') {
	        store.paletteOpen = true;
	        renderPalette();
	      } else if (action === 'clear-filters') {
	        store.query = '';
	        store.status = 'all';
	        store.priority = 'all';
	        render();
	      } else if (action === 'import-pipeline') {
	        await runMutation(() => api.importPipeline());
      } else if (action === 'palette-select') {
        const handler = store.paletteActions?.[target.dataset.paletteId];
        if (handler) handler();
	      } else if (action === 'create-account') {
	        await createAccount();
	      } else if (action === 'close-account-modal') {
	        store.accountModalOpen = false;
	        render();
	      } else if (action === 'create-memory') {
	        store.view = 'ai';
	        render();
	      } else if (action === 'delete-memory') {
	        await runMutation(() => api.deleteMemory(target.dataset.memoryId));
	      } else if (action === 'task-status') {
	        await runMutation(() => api.patchTask(target.dataset.taskId, {status: target.dataset.status}));
	      } else if (action === 'delete-task') {
	        await runMutation(() => api.deleteTask(target.dataset.taskId));
	      } else if (action === 'proposal-status') {
	        await runMutation(() => api.patchProposal(target.dataset.proposalId, {status: target.dataset.status}));
	      } else if (action === 'delete-contact') {
	        await runMutation(() => api.deleteContact(target.dataset.contactId));
	      } else if (action === 'toggle-primary-contact') {
	        await runMutation(() => api.patchContact(target.dataset.contactId, {isPrimary: true}));
	      } else if (action === 'delete-note') {
	        await runMutation(() => api.deleteNote(target.dataset.noteId));
	      } else if (action === 'quick-timeline' && store.selectedClientId) {
	        const eventType = target.dataset.eventType;
	        const notes = prompt(eventType + ' notes', '') || '';
	        await runMutation(() => api.addTimeline(store.selectedClientId, {
	          eventType,
	          timestamp: new Date().toISOString(),
	          contactName: null,
	          notes,
	          duration: null,
	          followUpDate: null,
	          loggedBy: 'Hamid',
	        }));
	      } else if (action === 'log-email' && clientId) {
	        const status = target.dataset.status;
	        await runMutation(() => api.addEvent(clientId, {
          channel: 'email',
          status,
          summary: status === 'replied' ? 'Reply logged from the client account.' : 'Email outreach event logged from the CRM.',
	        }));
	      } else if (action === 'log-call' && clientId) {
	        const status = target.dataset.status === 'booked' ? 'booked' : 'sent';
	        await runMutation(() => api.addEvent(clientId, {
	          channel: 'call',
	          status,
	          summary: status === 'booked' ? 'Call outcome logged as booked.' : 'Manual call attempt logged in the CRM.',
	        }));
	      }
	    });

    document.addEventListener('submit', async (event) => {
      const form = event.target;
      const formType = form.dataset.form;
      if (!formType) return;
      event.preventDefault();
      const active = activeClient();
      const data = Object.fromEntries(new FormData(form).entries());
	      if (formType === 'new-account') {
	        const payload = {
	          businessName: data.businessName,
	          businessType: data.businessType,
	          area: data.area,
	          websiteUrl: data.websiteUrl || null,
	          phoneNumber: data.phoneNumber || null,
	          emailAddress: data.emailAddress || null,
	          address: data.address || null,
	          googleRating: data.googleRating ? Number(data.googleRating) : null,
	          reviewCount: data.reviewCount ? Number(data.reviewCount) : null,
	          accountStatus: data.accountStatus,
	          priority: data.priority,
	          dueDate: data.dueDate || null,
	          nextActionNotes: data.nextActionNotes || '',
	          dealValue: data.dealValue ? Number(data.dealValue) : 0,
	          siteScore: data.siteScore ? Number(data.siteScore) : 0,
	          sourceNotes: data.sourceNotes || '',
	        };
	        await runMutation(() => api.createAccount(payload));
	        store.accountModalOpen = false;
	      } else if (formType === 'memory') {
	        const tags = String(data.tags || '').split(',').map((item) => item.trim()).filter(Boolean);
	        await runMutation(() => api.addMemory({
	          clientId: data.clientId || null,
          kind: data.kind,
          title: data.title,
          note: data.note,
          tags,
        }));
        form.reset();
      } else if (formType === 'client-status' && active) {
        await runMutation(() => api.patchClient(active.clientId, {
          accountStatus: data.accountStatus,
          followUpPriority: data.followUpPriority,
          followUpNextStep: data.followUpNextStep,
          followUpDueDate: data.followUpDueDate,
          closeProbability: Number(data.closeProbability || 0),
          valueEstimate: Number(data.valueEstimate || 0),
        }));
	      } else if (formType === 'contact' && active) {
	        await runMutation(() => api.addContact(active.clientId, {
          fullName: data.fullName,
          role: data.role,
          email: data.email || null,
          phone: data.phone || null,
          linkedin: data.linkedin || null,
          notes: data.notes || '',
          isPrimary: false,
          status: 'reachable',
	        }));
	        form.reset();
	      } else if (formType === 'account-contact' && store.selectedClientId) {
	        await runMutation(() => api.addAccountContact(store.selectedClientId, {
	          fullName: data.fullName,
	          role: data.role,
	          email: data.email || null,
	          phone: data.phone || null,
	          linkedin: data.linkedin || null,
	          bestTime: data.bestTime,
	          contactPreference: data.contactPreference,
	          notes: data.notes || '',
	          isPrimary: false,
	        }));
	        form.reset();
	      } else if (formType === 'task' && active) {
	        await runMutation(() => api.addTask(active.clientId, {
          title: data.title,
          description: data.description,
          priority: data.priority,
          dueDate: data.dueDate,
          lane: data.lane,
	        }));
	        form.reset();
	      } else if (formType === 'account-task' && store.selectedClientId) {
	        await runMutation(() => api.addAccountTask(store.selectedClientId, {
	          title: data.title,
	          description: data.description || '',
	          priority: data.priority,
	          dueDate: data.dueDate,
	          owner: data.owner || 'Hamid',
	          taskType: data.taskType,
	          lane: 'ops',
	        }));
	        form.reset();
	      } else if (formType === 'proposal' && active) {
	        await runMutation(() => api.addProposal(active.clientId, {
          title: data.title,
          packageName: data.packageName,
          price: Number(data.price || 0),
          probability: Number(data.probability || 0),
          nextStep: data.nextStep,
          scope: String(data.scope || '').split('\n').map((item) => item.trim()).filter(Boolean),
	        }));
	      } else if (formType === 'account-proposal' && store.selectedClientId) {
	        await runMutation(() => api.saveProposal(store.selectedClientId, {
	          title: data.title,
	          packageName: data.packageName,
	          price: Number(data.price || 0),
	          probability: Number(data.probability || 0),
	          estimatedDelivery: data.estimatedDelivery || '',
	          status: data.status || 'draft',
	          nextStep: data.nextStep || '',
		          scope: String(data.scope || '').split('\n').map((item) => item.trim()).filter(Boolean),
	        }));
	      } else if (formType === 'account-note' && store.selectedClientId) {
	        await runMutation(() => api.addNoteEntry(store.selectedClientId, {body: data.body || ''}));
	        form.reset();
	      } else if (formType === 'comment' && active) {
	        await runMutation(() => api.addComment(active.clientId, {
	          body: data.body,
        }));
        form.reset();
      }
    });

    document.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        store.paletteOpen = !store.paletteOpen;
        renderPalette();
      }
	      if (event.key === 'Escape') {
	        store.paletteOpen = false;
	        store.accountModalOpen = false;
	        renderPalette();
	        renderAccountModal();
	      }
	    });

	    paletteRoot.addEventListener('click', (event) => {
	      if (event.target === paletteRoot) {
	        store.paletteOpen = false;
	        renderPalette();
	      }
	    });

	    accountModalRoot.addEventListener('click', (event) => {
	      if (event.target === accountModalRoot) {
	        store.accountModalOpen = false;
	        renderAccountModal();
	      }
	    });

	    hydratePanels().then(refreshState).catch(() => render());
  </script>
</body>
</html>
